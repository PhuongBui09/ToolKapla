<!doctype html>
<html>
    <head>
        <title>Flow Test</title>
    </head>
    <body>
        <h2>Test Flow 2 Section Visibility</h2>

        <div>
            <label>
                <input type="radio" name="flowType" value="flow1" checked />
                Flow 1
            </label>
            <label>
                <input type="radio" name="flowType" value="flow2" />
                Flow 2
            </label>
        </div>

        <div
            id="flow2ScoreRangeSection"
            style="display: none; border: 2px solid red; padding: 10px; margin-top: 10px;"
        >
            <h3>Flow 2 Score Range Section (should be hidden initially)</h3>
            <label>
                <input type="radio" name="flow2ScoreRange" value="8-9" />
                8-9
            </label>
            <label>
                <input type="radio" name="flow2ScoreRange" value="7-9" />
                7-9
            </label>
            <label>
                <input type="radio" name="flow2ScoreRange" value="6-8" />
                6-8
            </label>
            <label>
                <input type="radio" name="flow2ScoreRange" value="custom" />
                Custom
            </label>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                console.log('DOM Content Loaded');

                const flowRadios = document.querySelectorAll('input[name="flowType"]');
                const flow2Section = document.getElementById('flow2ScoreRangeSection');
                const flow2RangeRadios = document.querySelectorAll('input[name="flow2ScoreRange"]');

                const updateFlow2Visibility = () => {
                    console.log('updateFlow2Visibility called');
                    const selected = document.querySelector('input[name="flowType"]:checked');
                    console.log('Selected flow:', selected.value);

                    if (selected && selected.value === 'flow2') {
                        console.log('Setting display to block');
                        if (flow2Section) flow2Section.style.display = 'block';

                        const checkedScoreRange = document.querySelector('input[name="flow2ScoreRange"]:checked');
                        if (!checkedScoreRange && flow2RangeRadios.length > 0) {
                            console.log('Setting first score range as checked');
                            flow2RangeRadios[0].checked = true;
                        }
                    } else {
                        console.log('Setting display to none');
                        if (flow2Section) flow2Section.style.display = 'none';
                    }
                };

                flowRadios.forEach((radio) => {
                    radio.addEventListener('change', (e) => {
                        console.log('Flow radio changed to:', e.target.value);
                        updateFlow2Visibility();
                    });
                });

                // Initial call
                updateFlow2Visibility();
            });
        </script>
    </body>
</html>
