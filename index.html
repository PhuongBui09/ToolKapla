<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Tạo Script Nhận Xét & Gửi Tự Động</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: "JetBrains Mono", monospace;
        background: #0f111a;
        color: #e5e5e5;
      }
      .container {
        max-width: 1000px;
        margin: 40px auto;
        background: #1e1e2f;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }
      h2 {
        text-align: center;
        color: #76c7ff;
        margin-bottom: 25px;
      }
      label {
        font-weight: 600;
        display: block;
        margin-bottom: 10px;
      }
      textarea {
        width: 100%;
        height: 180px;
        padding: 12px;
        border: 1px solid #444;
        border-radius: 10px;
        resize: vertical;
        font-size: 15px;
        background: #0f111a;
        color: #e5e5e5;
      }
      textarea:focus {
        outline: none;
        border-color: #76c7ff;
      }
      button {
        display: inline-block;
        margin-top: 15px;
        padding: 12px 25px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: #76c7ff;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.3s;
      }
      button:hover {
        background: #4fa3e0;
      }
      h3 {
        margin-top: 30px;
        color: #76c7ff;
      }
      .code-block {
        position: relative;
        margin-top: 15px;
        border-radius: 10px;
        overflow: auto;
      }
      .copy-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: #00b894;
        border: none;
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
        font-size: 12px;
        color: #fff;
      }
      .copy-btn:hover {
        background: #019971;
      }
      pre {
        margin: 0;
        padding: 20px;
        background: #1e1e2f;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-wrap: break-word;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Tạo Script Nhận Xét & Gửi Tự Động</h2>

      <label>Nhập danh sách nhận xét (mỗi dòng là 1 câu):</label>
      <textarea
        id="commentsInput"
        placeholder="Nhập nhận xét ở đây..."
      ></textarea>
      <button onclick="generateScripts()">Tạo Script</button>

      <div class="script-section">
        <h3>Script 1: Thêm nhận xét & điểm danh</h3>
        <div class="code-block">
          <button class="copy-btn" onclick="copyScript('script1Output')">
            Copy
          </button>
          <pre><code id="script1Output" class="language-js">/* Chưa có script, bấm "Tạo Script" để hiển thị */</code></pre>
        </div>
      </div>

      <div class="script-section">
        <h3>Script 2: Gửi tới học sinh Có mặt / Đi trễ</h3>
        <div class="code-block">
          <button class="copy-btn" onclick="copyScript('script2Output')">
            Copy
          </button>
          <pre><code id="script2Output" class="language-js">/* Chưa có script, bấm "Tạo Script" để hiển thị */</code></pre>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>

    <script>
      function generateScripts() {
        const commentsText = document
          .getElementById("commentsInput")
          .value.trim();
        if (!commentsText) {
          alert("Bạn chưa nhập nhận xét!");
          return;
        }

        const commentsArray = commentsText
          .split("\n")
          .map((c) => c.trim())
          .filter((c) => c.length > 0);

        const script1 = `(function() {
  const rows = document.querySelectorAll("#tbl_student tbody tr");
  const comments = ${JSON.stringify(commentsArray, null, 2)};
  let availableComments = [...comments];
  let savedCount = 0;
  let duplicatedStudents = [];

  rows.forEach(row => {
    const nameCell = row.querySelector("td.student_name");
    const studentName = nameCell ? nameCell.textContent.trim() : "Không rõ";

    const select = row.querySelector('select[name="attendance_type"]');
    const commentInput = row.querySelector(".description");
    if (!select) return;

    let attendance = select.value;
    if (!attendance || attendance.trim() === "") {
      select.value = "A";
      attendance = "A";
      saveAttendance($(select));
    }

    if ((attendance === "P" || attendance === "L") && commentInput) {
      let chosenComment;
      if (availableComments.length > 0) {
        const idx = Math.floor(Math.random() * availableComments.length);
        chosenComment = availableComments[idx];
        availableComments.splice(idx, 1);
      } else {
        chosenComment = comments[Math.floor(Math.random() * comments.length)];
        duplicatedStudents.push(studentName);
      }

      commentInput.value = chosenComment;
      saveAttendance($(commentInput));
      savedCount++;
    }
  });

  console.log("===== KẾT QUẢ =====");
  console.log("Đã lưu cho " + savedCount + " học sinh.");
  if (duplicatedStudents.length > 0) {
    console.log("Học sinh bị trùng nhận xét:");
    duplicatedStudents.forEach(n => console.log("- " + n));
  } else {
    console.log("Không có học sinh nào bị nhận xét trùng.");
  }
})();`;

        const script2 = `(function () {
  const rows = document.querySelectorAll("#tbl_student tbody tr");
  let sent = 0; 
  let sentList = [];

  rows.forEach(row => {
      const select = row.querySelector('select[name="attendance_type"]');
      const sendButton = row.querySelector('input.btn_send');
      if (!select || !sendButton) return;

      const attendance = select.value;
      if (attendance === "P" || attendance === "L") {
          sendButton.click();
          const name = row.querySelector(".student_name")?.innerText.trim() || "Không rõ tên";
          sentList.push(name);
          sent++;
      }
  });

  console.log(\`ĐÃ GỬI CHO \${sent} HỌC SINH (P + L).\`);
  console.log("Danh sách đã gửi:", sentList);
})();`;

        document.getElementById("script1Output").textContent = script1;
        document.getElementById("script2Output").textContent = script2;

        Prism.highlightAll();
      }

      function copyScript(id) {
        const scriptContent = document.getElementById(id).textContent;
        navigator.clipboard.writeText(scriptContent).then(() => {
          alert("Đã copy script!");
        });
      }
    </script>
  </body>
</html>
