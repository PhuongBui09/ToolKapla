<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Tạo Script Nhận Xét & Gửi Tự Động</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="header-with-help">
        <h2>Tạo Script Nhận Xét & Gửi Tự Động</h2>
      </div>

      <div class="comment-box">
        <fieldset>
          <legend>Mô tả buổi học</legend>
          <textarea
            id="lessonDescription"
            placeholder="Ví dụ: Học Scratch cơ bản, làm quen với giao diện và các khối lệnh..."
          ></textarea>
        </fieldset>
      </div>

      <button onclick="generateCommentsByAI()" style="margin: 20px 0">🤖 Sinh nhận xét bằng AI</button>

      <div class="comment-box">
        <fieldset>
          <legend>Nhận xét</legend>
          <textarea
            id="commentsInput"
            placeholder="Nhập nhận xét ở đây hoặc AI tự sinh ra..."
          ></textarea>
        </fieldset>
      </div>

      <div class="score-box">
        <fieldset>
          <legend>Chọn điểm</legend>

          <div class="score-option">
            <label>
              <input type="radio" name="scoreMode" value="fixed" checked />
              Điểm cố định:
            </label>
            <input type="number" id="fixedScore" min="1" max="10" value="9" />
          </div>

          <div class="score-option">
            <label>
              <input type="radio" name="scoreMode" value="range" />
              Random điểm từ:
            </label>
            <input type="number" id="scoreMin" min="1" max="10" value="8" />
            đến
            <input type="number" id="scoreMax" min="1" max="10" value="9" />
          </div>
        </fieldset>
      </div>

      <button onclick="generateScriptsUI()">Tạo Script</button>

    <div class="script-section">
      <div class="script-box">
        <div class="script-legend">
          <span>Script: Thêm nhận xét, điểm danh, điểm & gửi</span>
          <button class="copy-btn" onclick="copyScript('scriptOutput')">Copy</button>
        </div>
        <pre><code id="scriptOutput" class="language-js">/* Chưa có script, bấm "Tạo Script" để hiển thị */</code></pre>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    <script type="module" src="./Js/main.js"></script>
  </body>
</html>
